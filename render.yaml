services:
  - type: web
    name: alok-portfolio-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alok-portfolio-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://alok-portfolio.vercel.app

databases:
  - name: alok-portfolio-db
    databaseName: alok_portfolio
    user: alok_admin
    plan: free
